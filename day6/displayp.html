<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #content{
            display: none;
        }
        div{
            display: inline;
        }
        #one{
            color: red;
            display: inline;
        }
        #block{
            color: green;
            display: block;
        }
        </style>
</head>
<body>
    <p id="content">Hello Big Billon Day Sale is LIVE  </p>
    <div>
        this is an example of display property.
        <p id="one"> Hello </p>
    </div>
    <div>
        this is an example of display property.
        <p id="block"> Hello </p>
    </div>
</body>
</html>
