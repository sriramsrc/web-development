<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .products{
            background-color: lightblue;
            display: flex;
            height: 500px;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center; 
            gap: 20px;
            align-items: center;
        }
        .box{
            border: 1px solid black;
            height: 100px;
            width: 100px;
            background-color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="products">
        <div class="box">cake</div>
        <div class="box">cookies</div>
        <div class="box">brownies</div>
    </div>
</body>
</html>
